name: Terraform Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create Terraform State Bucket
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/terraform-bootstrap

    env:
      TF_VAR_rustfs_ip: ${{ secrets.RUSTFS_IP }}
      TF_VAR_rustfs_port: ${{ secrets.RUSTFS_PORT }}
      TF_VAR_access_key: ${{ secrets.RUSTFS_ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.RUSTFS_SECRET_KEY }}
      TF_VAR_rustfs_bucket: ${{ secrets.RUSTFS_BUCKET }} 
     

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify RustFS connectivity
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${TF_VAR_rustfs_ip}:${TF_VAR_rustfs_port}")
          echo "RustFS responded with HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 000 ]; then
            echo "Failed to connect to RustFS"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan