- name: Common Setup - Install Docker Engine
  hosts: docker_hosts
  become: true
  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes


- name: Deploy Database Services (VM1)
  hosts: database_nodes
  become: true
  vars:
    mssql_sa_password: "{{ lookup('env', 'MSSQL_SA_PASSWORD') | default('ChangeMe123!', true) }}"
  tasks:
    - name: Run MS SQL Server Docker Container
      community.docker.docker_container:
        name: mssql-server
        image: mcr.microsoft.com/mssql/server:2022-latest
        state: started
        restart_policy: always
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "{{ mssql_sa_password }}"
        published_ports:
          - "1433:1433"